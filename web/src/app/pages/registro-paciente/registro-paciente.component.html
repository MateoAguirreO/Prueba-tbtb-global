<nav class="breadcrumb"><a routerLink="/pacientes">Inicio</a></nav>

<h1>Registrar paciente</h1>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <label>
    Nombre
    <input type="text" formControlName="nombre" />
  </label>

  <label>
    Documento de identidad
    <input type="text" formControlName="documentoIdentidad" />
  </label>

  <div class="campo-telefono">
    <div class="pais-dropdown">
      <span class="etiqueta">País</span>
      <button type="button" class="pais-boton" (click)="menuPaisesAbierto = !menuPaisesAbierto">
        <span class="bandera">{{ paisSeleccionado.bandera }}</span>
        <span>{{ paisSeleccionado.codigo }}</span>
        <span class="flecha">▾</span>
      </button>
      @if (menuPaisesAbierto) {
        <ul class="pais-lista">
          @for (pais of paises; track pais.codigo) {
            <li>
              <button type="button" (click)="elegirPais(pais)">
                <span class="bandera">{{ pais.bandera }}</span>
                <span>{{ pais.codigo }} {{ pais.nombre }}</span>
              </button>
            </li>
          }
        </ul>
      }
    </div>

    <label class="campo-numero">
      Teléfono
      <input type="tel" formControlName="telefonoLocal" placeholder="3001112233" />
    </label>
  </div>

  <label>
    Correo (opcional)
    <input type="email" formControlName="correo" />
  </label>

  <label>
    Ciudad
    <input type="text" formControlName="ciudad" list="lista-ciudades" placeholder="Escribe para buscar..." />
    <datalist id="lista-ciudades">
      @for (ciudad of ciudades; track ciudad) {
        <option [value]="ciudad"></option>
      }
    </datalist>
  </label>

  <label>
    Fecha de inicio de tratamiento
    <input type="date" formControlName="fechaInicioTratamiento" />
  </label>

  @if (errorMensaje) {
    <p class="error">{{ errorMensaje }}</p>
  }

  <div class="acciones">
    <button type="submit" class="boton-principal" [disabled]="enviando">Registrar</button>
    <a class="boton-secundario" routerLink="/pacientes">Cancelar</a>
  </div>
</form>
